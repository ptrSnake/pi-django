{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<h1>Welcome{% if user.is_authenticated %}, {{ user.full_name }}{% endif %}!</h1>
{% if user.is_authenticated %}
    <p>You are logged in as {{ user.email }}.</p>
{% else %}
    <p><a href="{% url 'users:login' %}">Login</a> or <a href="{% url 'users:register' %}">create an account</a>.</p>
{% endif %}
{% endblock %}
