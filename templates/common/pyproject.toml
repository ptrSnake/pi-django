[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
description = "Django project scaffolded with pi-django, following STILE-DJANGO.md conventions."
readme = "README.md"
requires-python = "__REQUIRES_PYTHON__"
dependencies = []

[dependency-groups]
dev = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.django.test"
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "__RUFF_TARGET__"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D100", "D104", "D106", "D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]
"**/migrations/**" = ["D", "E501", "I"]

[tool.ruff.lint.isort]
known-first-party = ["config", "users"]

[tool.ruff.format]
exclude = ["**/migrations/**"]
